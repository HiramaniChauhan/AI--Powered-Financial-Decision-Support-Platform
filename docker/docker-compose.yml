version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: finmemx-postgres
    environment:
      POSTGRES_USER: finmem
      POSTGRES_PASSWORD: finmem
      POSTGRES_DB: finmemx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmem"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: finmemx-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
